services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: si_arena
      POSTGRES_PASSWORD: si_arena
      POSTGRES_DB: si_arena
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U si_arena -d si_arena"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
