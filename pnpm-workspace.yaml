packages:
  - apps/*
  - packages/*
  - games/*

catalog:
  "typescript": "6.0.3"
  "tsdown": "0.23.1"
  "@types/node": "26.6.5"
  "vue": "3.5.44"
  "vue-router": "5.4.0"
  "vite": "8.3.4"
  "@vitejs/plugin-vue": "6.0.10"
  "tailwindcss": "4.3.3"
  "@tailwindcss/vite": "4.3.3"
  "vue-tsc": "3.3.13"
  "fastify": "5.12.7"
  "drizzle-orm": "0.45.4"
  "drizzle-kit": "0.31.11"
  "pg": "8.23.1"
  "@types/pg": "8.23.1"
  "tsx": "4.23.15"
  "oxlint": "1.88.0"
  "oxfmt": "0.73.0"
  "simple-git-hooks": "2.14.0"
  "lint-staged": "17.6.0"
  "@commitlint/cli": "21.2.4"
  "@commitlint/config-conventional": "21.2.4"

minimumReleaseAgeExclude:
  - ret@0.5.1
  - "@commitlint/cli@21.2.4"
  - "@commitlint/config-conventional@21.2.4"
  - "@commitlint/ensure@21.2.4"
  - "@commitlint/lint@21.2.4"
  - "@commitlint/load@21.2.4"
  - "@commitlint/rules@21.2.4"

allowBuilds:
  esbuild: true
  simple-git-hooks: true
