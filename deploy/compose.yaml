# 本地开发用的 PostgreSQL。生产编排见 deploy/compose.prod.yaml。
# 用法（务必带 -f，在仓库根目录执行）：
#   docker compose -f deploy/compose.yaml up -d db
#
# 项目名必须显式固定：compose 默认用所在目录名（deploy/）推导项目名，
# 那样卷会变成 deploy_postgres_data，与历史卷 si-arena_postgres_data 脱节。
name: si-arena
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: si_arena
      POSTGRES_PASSWORD: si_arena
      POSTGRES_DB: si_arena
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U si_arena -d si_arena"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
